name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      # Pull down git repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js 22 environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Clean install dependencies from package-lock
      - name: Install dependencies
        run: npm ci

      # Static code linting
      - name: Run linter
        run: npm run lint

      # End-to-End (E2E) testing with Cypress (using data-cy attributes)
      - name: Run Cypress E2E tests
        run: npm run test:e2e

      # Build production bundle with Vite
      - name: Build
        run: npm run build

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry (Industry Standard Option B)
      - name: Log in to GitHub Container Registry
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image to GHCR (Build Once principle: built & tested in CI, deployed to CD)
      - name: Build and push Docker image to GHCR
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}/gamevault-frontend:latest"
          docker buildx build --provenance=false -t "$IMAGE" --push .

  deploy:
    name: Continuous Deployment (Educloud Production)
    needs: build
    runs-on: self-hosted
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Pre-built Frontend Container on Educloud
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}/gamevault-frontend:latest"

          # Pull pre-built image verified in CI (No compilation on production runner)
          docker pull "$IMAGE"
          docker stop gamevault-frontend 2>/dev/null || true
          docker rm gamevault-frontend 2>/dev/null || true

          BACKEND_NET=$(docker inspect gamevault-backend --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}}{{end}}' 2>/dev/null || echo "bridge")
          docker run -d \
            --name gamevault-frontend \
            --restart always \
            -p 3000:80 \
            --network "$BACKEND_NET" \
            "$IMAGE"
          docker ps
