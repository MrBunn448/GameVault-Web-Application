name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      # Pull down git repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js 22 environment
      - name: Set up Java JDK / Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Clean install dependencies from package-lock
      - name: Install dependencies
        run: npm ci

      # Static code linting
      - name: Run linter
        run: npm run lint

      # End-to-End (E2E) testing with Cypress
      - name: Run Cypress E2E tests
        run: npm run test:e2e

      # Build production bundle with Vite
      - name: Build
        run: npm run build

  deploy:
    name: Continuous Deployment (Educloud)
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Frontend Container on Educloud
        run: |
          docker build -t gamevault-frontend .
          docker stop gamevault-frontend || true
          docker rm gamevault-frontend || true
          BACKEND_NET=$(docker inspect gamevault-backend --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}}{{end}}' 2>/dev/null || echo "bridge")
          docker run -d \
            --name gamevault-frontend \
            --restart always \
            -p 3000:80 \
            --network "$BACKEND_NET" \
            gamevault-frontend
          docker ps
